<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#1a150d;color:#f5e6c0;direction:rtl;line-height:1.6;overflow-x:hidden}
:root{
  --brown:#f5e6c0;--brown2:#c4a97d;--brown3:#9a7a4a;
  --gold:#c99a2e;--gold2:#3a2d0a;--gold3:#1e1a0a;
  --cream:#1e1a14;--white:#111009;--muted:#9a7a4a;--border:rgba(201,154,46,.22);
}

/* NAV */
nav{background:#fff;padding:0 6%;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-text{font-size:20px;font-weight:700;color:var(--brown)}
.nav-logo-text span{color:#c99a2e}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{color:var(--brown3);text-decoration:none;font-size:15px;font-weight:500;padding:6px 13px;border-radius:6px;transition:all .2s}
.nav-link:hover,.nav-link.active{color:var(--brown);background:rgba(0,0,0,.06)}
.nav-cta{padding:8px 20px;background:var(--gold);color:var(--brown);border:none;border-radius:7px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;margin-right:8px}
/* HAMBURGER MENU */
.hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-right:-6px;margin-left:6px}
.hamburger span{display:block;width:22px;height:2px;background:var(--brown);border-radius:2px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-menu{display:none;position:fixed;top:64px;right:0;left:0;background:#fff;flex-direction:column;padding:8px 6% 18px;gap:2px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.12);border-top:2px solid var(--border)}
.mobile-menu.open{display:flex}
.mobile-menu a{color:var(--brown3);font-size:15px;padding:11px 4px;border-bottom:1px solid var(--border);text-decoration:none;font-weight:500}
.mobile-menu a:last-child{border-bottom:none}
.mobile-menu .m-cta{margin-top:10px;text-align:center;background:var(--gold);color:var(--brown);font-weight:700;border-radius:7px;padding:11px 20px;border-bottom:none}

/* HERO */
.fdot{width:6px;height:6px;background:var(--gold);border-radius:50%;animation:fdot-pulse 2s infinite;flex-shrink:0}
@keyframes fdot-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hero{background:#1a150d;padding:68px 6% 0;text-align:center;border-bottom:1px solid var(--border)}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:#1e1a14;border:1px solid var(--border);color:var(--brown2);font-size:13px;font-weight:600;padding:5px 16px;border-radius:20px;margin-bottom:22px;letter-spacing:.05em;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hero h1{font-size:48px;font-weight:900;color:var(--brown);line-height:1.12;margin-bottom:14px;letter-spacing:-.6px;max-width:680px;margin-left:auto;margin-right:auto}
.hero h1 em{color:var(--gold);font-style:normal}
.hero-sub{font-size:15px;color:var(--muted);max-width:520px;margin:0 auto 24px;line-height:1.8}
.hero-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.hero-pill{padding:5px 14px;background:#2a2010;border:1px solid var(--border);border-radius:14px;font-size:13px;font-weight:600;color:var(--brown2)}

/* HERO STATS */
.hero-stats{display:flex;background:#1e1a14;border-top:1px solid var(--border)}
.hstat{flex:1;padding:18px 0;text-align:center;border-left:1px solid var(--border);transition:background .2s}
.hstat:last-child{border-left:none}
.hstat:hover{background:rgba(201,154,46,.04)}
.hstat-num{font-size:26px;font-weight:900;color:var(--gold);line-height:1;margin-bottom:4px}
.hstat-num em{color:var(--gold);font-style:normal}
.hstat-lbl{font-size:11px;color:var(--muted);line-height:1.4}

/* SECTION LAYOUT */
.section{padding:89px 6%;background:#1a150d}
.section.alt{background:#1a150d;border-top:1px solid var(--border)}
.section.dark{background:var(--brown)}
.section-inner{max-width:1060px;margin:0 auto}
.section-tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);background:rgba(201,154,46,.1);border:1px solid rgba(201,154,46,.2);padding:3px 12px;border-radius:10px;margin-bottom:12px}
.section-tag.light{color:var(--gold2);background:rgba(201,154,46,.08);border-color:rgba(201,154,46,.15)}
.section-title{font-size:34px;font-weight:800;color:var(--brown);margin-bottom:8px;line-height:1.2}
.section-title.light{font-size:34px;color:#f5e6c0}
.section-sub{font-size:15px;color:var(--muted);margin-bottom:40px;line-height:1.75;max-width:600px}
.section-sub.light{color:rgba(245,230,192,.45)}

/* FEATURE GRID */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feat-card{background:#1e1a14;border:1.5px solid var(--border);border-radius:16px;padding:24px 22px;transition:all .2s}
.feat-card:hover{box-shadow:0 6px 22px rgba(0,0,0,.1);border-color:var(--gold);transform:translateY(-2px)}
.feat-icon{font-size:28px;margin-bottom:12px}
.feat-name{font-size:21px;font-weight:800;color:var(--brown);margin-bottom:7px}
.feat-desc{font-size:14px;color:var(--muted);line-height:1.7}

/* FEATURE GRID ON DARK */
.feat-card.dark-card{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.1)}
.feat-card.dark-card:hover{background:rgba(255,255,255,.09);border-color:rgba(201,154,46,.4)}
.feat-card.dark-card .feat-name{color:#f5e6c0}
.feat-card.dark-card .feat-desc{color:rgba(245,230,192,.46)}

/* ANOMALY LIST */
.anom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.anom-item{display:flex;gap:12px;padding:16px;background:#1e1a14;border:1px solid var(--border);border-radius:12px;align-items:flex-start;transition:border-color .2s}
.anom-item:hover{border-color:var(--gold)}
.anom-n{width:28px;height:28px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--brown);flex-shrink:0;margin-top:1px}
.anom-body{}
.anom-title{font-size:14px;font-weight:700;color:var(--brown);margin-bottom:3px}
.anom-desc{font-size:13px;color:var(--muted);line-height:1.6}

/* CAPABILITIES ROWS */
.cap-grid{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.cap-row{display:grid;grid-template-columns:220px 1fr;border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s}
.cap-row:hover{border-color:var(--gold)}
.cap-row-left{background:var(--brown);padding:22px 24px;display:flex;flex-direction:column;justify-content:center}
.cap-row-icon{font-size:26px;margin-bottom:8px}
.cap-row-name{font-size:15px;font-weight:800;color:#f5e6c0;margin-bottom:4px}
.cap-row-sub{font-size:11px;color:rgba(245,230,192,.45);line-height:1.5}
.cap-row-right{background:var(--white);padding:18px 22px;display:flex;flex-wrap:wrap;gap:8px;align-content:center}
.cap-tag{padding:4px 13px;background:#1a150d;border:1px solid var(--border);border-radius:16px;font-size:12px;color:var(--brown2);font-weight:500;transition:border-color .2s}
.cap-tag:hover{border-color:var(--gold)}

/* TWO-COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.two-col-text{}
.two-col-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px}

/* MODES */
.modes-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:36px}
.mode-box{background:#1e1a14;border:1.5px solid var(--border);border-radius:16px;padding:26px 24px;transition:border-color .2s}
.mode-box:hover{border-color:var(--gold)}
.mode-box.featured{border-color:var(--gold);background:#2a2010}
.mode-label{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--brown);background:var(--gold2);padding:2px 10px;border-radius:8px;margin-bottom:12px}
.mode-box.featured .mode-label{background:var(--gold);color:var(--brown)}
.mode-title{font-size:18px;font-weight:800;color:var(--brown);margin-bottom:8px}
.mode-desc{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.7}
.mode-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.mode-list li{font-size:14px;color:var(--brown2);display:flex;gap:8px}
.mode-list li::before{content:'✓';color:var(--gold);font-weight:700;flex-shrink:0}

/* EXPORTS */
.export-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:32px}
.exp-card{background:#1e1a14;border:1.5px solid var(--border);border-radius:12px;padding:18px 14px;text-align:center;transition:all .2s}
.exp-card:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.exp-icon{font-size:26px;margin-bottom:8px}
.exp-name{font-size:14px;font-weight:700;color:var(--brown);margin-bottom:4px}
.exp-desc{font-size:12px;color:var(--muted)}

/* ISRAEL */
.israel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.isr-card{background:#1e1a14;border:1.5px solid var(--border);border-radius:14px;padding:22px 20px;border-bottom:3px solid var(--gold)}
.isr-title{font-size:16px;font-weight:800;color:var(--brown);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.isr-desc{font-size:14px;color:var(--muted);line-height:1.7}

/* ── DEMO BLOCKS ── */
.demo-wrap{margin-top:48px;padding-top:40px;border-top:1px solid var(--border)}
.demo-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.demo-pill{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(201,154,46,.12);border:1px solid rgba(201,154,46,.25);color:var(--gold);padding:3px 11px;border-radius:8px}
.demo-head-title{font-size:16px;font-weight:700;color:var(--brown)}

/* Anomaly table */
.demo-table-wrap{border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.demo-table{width:100%;border-collapse:collapse;font-size:13px}
.demo-table th{background:#1a150d;padding:9px 14px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1.5px solid var(--border);text-align:right;text-transform:uppercase;letter-spacing:.5px}
.demo-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--brown2);background:var(--white)}
.demo-table tr:last-child td{border-bottom:none}
.demo-table tr.dr td{background:#fffcf5}
.ok-b{display:inline-block;font-size:11px;font-weight:700;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:2px 9px;white-space:nowrap}
.warn-b{display:inline-block;font-size:11px;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:2px 9px;white-space:nowrap}
.err-b{display:inline-block;font-size:11px;font-weight:700;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:2px 9px;white-space:nowrap}
.demo-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 16px;background:#1a150d;border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;gap:8px}
.demo-footer strong{color:var(--brown)}

/* Benford chart */
.benford-demo-wrap{margin-top:48px;padding-top:40px;border-top:1px solid rgba(255,255,255,.1)}
.benford-demo-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.benford-pill{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(201,154,46,.1);border:1px solid rgba(201,154,46,.18);color:var(--gold2);padding:3px 11px;border-radius:8px}
.benford-chart-box{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:24px 20px 14px}
.benford-bars{display:flex;align-items:flex-end;gap:6px;height:140px;direction:ltr}
.b-group{display:flex;flex-direction:column;align-items:center;flex:1}
.b-pair{display:flex;align-items:flex-end;gap:2px;justify-content:center;height:120px;width:100%}
.b-exp{background:rgba(255,255,255,.22);border-radius:3px 3px 0 0;width:13px;min-height:3px}
.b-act{background:var(--gold);border-radius:3px 3px 0 0;width:13px;min-height:3px}
.b-act.hi{background:#e07b2a}
.b-lbl{font-size:11px;color:rgba(245,230,192,.45);margin-top:6px}
.b-lbl.hi{color:#fcd34d}
.b-legend{display:flex;gap:18px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.b-leg{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(245,230,192,.5)}
.b-swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0}
.b-results{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.b-res{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700}
.b-res.sus{background:rgba(217,119,6,.18);border:1px solid rgba(217,119,6,.35);color:#fcd34d}
.b-res.ok{background:rgba(22,163,74,.12);border:1px solid rgba(22,163,74,.25);color:#86efac}

/* FEATURE CARDS GRID */
.fcard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
.fcard{background:#1e1a14;border:1.5px solid var(--border);border-radius:12px;padding:20px 18px;display:flex;flex-direction:column;gap:6px;position:relative;transition:border-color .2s,box-shadow .2s}
.fcard:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.fcard.annual{border-color:rgba(201,154,46,.3);background:#2a2010}
.fcard-name{font-size:14px;font-weight:700;color:var(--brown);line-height:1.35}
.fcard-desc{font-size:12px;color:var(--muted);line-height:1.55;margin-top:2px}
.fcard-badge{font-size:10px;font-weight:700;background:var(--gold2);color:var(--brown);padding:1px 7px;border-radius:6px;align-self:flex-start;margin-top:4px}

/* MOBILE */
@media(max-width:768px){
  nav{padding:0 4%;height:56px}
  .nav-links .nav-link{display:none}
  .hamburger{display:flex}
  .mobile-menu{top:56px}
  .nav-cta{padding:7px 14px;font-size:13px;margin-right:0}
  .hero{padding:44px 5% 0}
  .hero h1{font-size:28px}
  .hero-sub{font-size:14px}
  .hero-stats{flex-wrap:wrap}
  .hstat{min-width:50%}
  .hstat-num{font-size:22px}
  .section{padding:48px 5%}
  .section.alt{padding:48px 5%}
  .section-title{font-size:24px}
  .section-sub{font-size:14px;margin-bottom:28px}
  .cap-row{grid-template-columns:1fr}
  .cap-row-right{border-top:1px solid var(--border)}
  .modes-wrap{grid-template-columns:1fr}
  .export-grid{grid-template-columns:1fr 1fr}
  .btn-dark,.btn-line{min-height:44px}
  .fcard-grid{grid-template-columns:1fr 1fr;gap:10px}
  .fcard{padding:14px 12px}
  .fcard-name{font-size:13px}
  .fcard-desc{font-size:11px}
  .feat-grid{grid-template-columns:1fr}
  .cta-section{padding:48px 5%}
  .cta-section h2{font-size:24px}
  .cta-section p{font-size:15px}
  .btn-dark,.btn-line{font-size:15px;padding:12px 22px;width:100%}
  .cta-btns{flex-direction:column;align-items:stretch}
  footer{flex-direction:column;align-items:flex-start;gap:14px}
  .footer-links{gap:14px}
}
@media(max-width:400px){
  .hero-stats{grid-template-columns:1fr 1fr}
  .fcard-grid{grid-template-columns:1fr}
  .export-grid{grid-template-columns:1fr}
  .hero h1{font-size:24px}
  .cap-row-right{padding:16px 14px}
  .cap-tag{font-size:11px;padding:4px 9px}
  .section-title{font-size:22px}
  .section{padding:40px 5%}
}

/* CTA */
.cta-section{background:#2a2010;padding:89px 6%;text-align:center;border-top:1px solid var(--border)}
.cta-section h2{font-size:36px;font-weight:800;color:var(--brown);margin-bottom:10px}
.cta-section p{font-size:17px;color:var(--muted);margin-bottom:30px;line-height:1.75}
.cta-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-dark{padding:14px 30px;background:var(--gold);color:#1e1a14;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;transition:opacity .2s}
.btn-dark:hover{opacity:.88}
.btn-line{padding:14px 24px;background:transparent;color:var(--brown);border:2px solid var(--border);border-radius:10px;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;transition:border-color .2s}
.btn-line:hover{border-color:var(--gold)}

/* FOOTER */
footer{background:var(--brown);padding:24px 6%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid rgba(255,255,255,.07)}
.footer-brand{font-size:18px;font-weight:700;color:rgba(245,230,192,.8)}
.footer-brand span{color:var(--gold)}
.footer-links{display:flex;gap:20px;flex-wrap:wrap}
.footer-links a{font-size:14px;color:rgba(245,230,192,.36);text-decoration:none}
.footer-links a:hover{color:rgba(245,230,192,.7)}
.footer-copy{font-size:13px;color:rgba(245,230,192,.24)}

/* ACCESSIBILITY */
*:focus{outline:none}
*:focus-visible{outline:2px solid #c99a2e;outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;top:-100px;right:0;background:#3a2000;color:#f5e6c0;padding:10px 18px;border-radius:0 0 8px 0;font-size:14px;font-weight:700;text-decoration:none;z-index:9999;transition:top .2s}
.skip-link:focus-visible{top:0}
